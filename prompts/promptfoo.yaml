name: 'Prompt Evaluation'

on:
  pull_request:
    paths:
      - 'prompts/**'  # Trigger the action when files in the 'prompts' folder are modified

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # Required to post comments on Pull Requests

    steps:
      - uses: actions/checkout@v4

      - uses: promptfoo/promptfoo-action@v1
        with:
          config: 'prompts/promptfoo.yaml'  # Path to your PromptFoo config
